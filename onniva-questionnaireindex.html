<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ON’NIVA | Votre maison est-elle éligible ?</title>
<style>
:root{color-scheme:dark;--bg:#101828;--card:#111a2e;--line:#22304d;--tx:#eef2fa;--mu:#9aa8c4;--ac:#93d877;--ok:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:20px 16px 48px}
.logo{height:40px;width:auto;display:block}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.tag{font-size:12px;color:var(--mu)}
h1{font-size:26px;line-height:1.25;margin:8px 0}
.sub{color:var(--mu);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .3s}
.st{font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
h2{font-size:20px;margin:0 0 16px}
.o{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;font:inherit;cursor:pointer}
.o:hover,.o.on{border-color:var(--ac);background:#1a2540}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input[type=text],input[type=number],input[type=tel],input[type=email],input[type=date],select{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0b1220;color:var(--tx);font:inherit}
.row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:14px;border-radius:12px;border:0;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#0b1220}
.btn.g{flex:0 0 auto;background:transparent;color:var(--mu);border:1px solid var(--line)}
.c{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mu);margin-top:14px}
.c input{margin-top:3px}
.f{font-size:12px;color:var(--mu);margin-top:20px;text-align:center}
.err{color:#fb7185;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>

function pv(a){return ['Panneaux photovoltaïques','Panneaux solaires et pompe à chaleur','Panneaux solaires et borne de recharge','Je souhaite être conseillé'].indexOf(a.install)>-1&&a.type!=='Appartement'}
var Q=[
{s:'A',id:'coord',t:'Commençons : qui êtes-vous ?',f:[['prenom','Prénom','text'],['nom','Nom','text'],['tel','Téléphone','tel'],['email','E-mail','email']],rgpd:1},
{s:'B',id:'age',t:'Quel âge avez-vous ?',o:['Moins de 18 ans','18 à 24 ans','25 à 34 ans','35 à 44 ans','45 à 54 ans','55 à 64 ans','65 ans et plus'],end:function(a){return a.age==='Moins de 18 ans'?MSG:''}},
{s:'B',id:'statut',t:'Êtes-vous propriétaire de votre logement ?',o:['Oui, propriétaire','Non, locataire','En cours d’acquisition','Propriétaire en indivision'],end:function(a){return a.statut==='Non, locataire'?MSG:''}},
{s:'C',id:'install',t:'Quelle installation vous intéresse ?',o:['Panneaux photovoltaïques','Pompe à chaleur air-air','Pompe à chaleur air-eau','Panneaux solaires et pompe à chaleur','Borne de recharge pour véhicule électrique','Panneaux solaires et borne de recharge','Je souhaite être conseillé']},
{s:'C',id:'objectif',t:'Quel est votre objectif principal ?',o:['Réduire ma facture d’électricité','Produire ma propre énergie','Revendre le surplus','Réduire mes dépenses de chauffage','Remplacer mon ancien système','Recharger mon véhicule électrique à domicile','Améliorer la performance énergétique de mon logement']},
{s:'C',id:'delai',t:'Quand souhaitez-vous réaliser votre projet ?',o:['Dès que possible','Dans les 30 jours','Dans les 3 mois','Dans les 6 mois','Dans l’année','Simplement pour me renseigner']},
{s:'C',id:'devis',t:'Avez-vous déjà réalisé un devis ?',o:['Oui','Non','Je compare actuellement plusieurs entreprises']},
{s:'D',id:'type',t:'Quel type de logement possédez-vous ?',o:['Maison individuelle','Maison mitoyenne','Appartement','Autre']},
{s:'D',id:'lieu',t:'Où se situe votre logement ?',f:[['cp','Code postal','text'],['ville','Ville','text'],['dept','Département','text']]},
{s:'D',id:'surface',t:'Quelle est la superficie approximative de votre habitation ?',f:[['surface','Surface en m²','number']]},
{s:'D',id:'anciennete',t:'Depuis combien de temps êtes-vous propriétaire ?',o:['Moins de 2 ans','2 à 5 ans','5 à 10 ans','Plus de 10 ans']},
{s:'D',id:'toit',t:'Quel est le type de toiture ?',o:['Tuiles','Ardoises','Bac acier','Toit plat','Autre','Je ne sais pas'],show:pv},
{s:'D',id:'expo',t:'Votre toiture est-elle bien exposée au soleil ?',o:['Sud','Sud-est / Sud-ouest','Est / Ouest','Nord','Je ne sais pas'],show:pv},
{s:'D',id:'ombre',t:'Votre toiture est-elle ombragée par des arbres ou des bâtiments ?',o:['Non, aucune ombre','Oui, un peu','Oui, beaucoup','Je ne sais pas'],show:pv},
{s:'D',id:'espace',t:'Disposez-vous d’un espace extérieur, d’un garage ou d’un parking permettant l’installation ?',o:YN,show:function(a){return !pv(a)}},
{s:'E',id:'facture',t:'Quel est le montant approximatif de votre facture énergétique mensuelle ?',o:['Moins de 100 €','100 à 150 €','150 à 250 €','250 à 400 €','Plus de 400 €']},
{s:'E',id:'budget',t:'Quel budget envisagez-vous pour votre projet ?',o:['Moins de 3 000 €','Entre 3 000 et 5 000 €','Entre 5 000 et 10 000 €','Entre 10 000 et 15 000 €','Entre 15 000 et 20 000 €','Plus de 20 000 €','Je ne connais pas encore le budget nécessaire']},
{s:'E',id:'finance',t:'Comment envisagez-vous de financer votre installation ?',o:['Avec mes économies','Avec un financement bancaire','Avec un paiement échelonné si disponible','Avec des aides auxquelles je pourrais être éligible','Je souhaite étudier les possibilités']},
{s:'F',id:'decideur',t:'Êtes-vous décisionnaire pour les travaux de votre logement ?',o:YN},
{s:'F',id:'conjoint',t:'Votre conjoint ou copropriétaire doit-il participer à la décision ?',o:YN},
{s:'F',id:'rdv',t:'Choisissez un rendez-vous provisoire avec un conseiller',f:[['rdv_date','Date souhaitée (du lundi au vendredi)','date'],['rdv_creneau','Créneau','sel','Matin (9h - 12h)|Après-midi (14h - 18h)']],skip:'Je ne souhaite pas de rendez-vous pour l’instant',rdv:1},
{s:'F',id:'contactmode',t:'Préférez-vous être contacté :',o:['Par téléphone','Par e-mail','Par un autre moyen disponible']}
];
var A={},i=0,app=document.getElementById('app');
function vis(){return Q.filter(function(q){return !q.show||q.show(A)})}
function score(){
var p=0;
if(A.statut==='Oui, propriétaire')p+=25;else if(A.statut&&A.statut!=='Non, locataire')p+=15;
if(['Dès que possible','Dans les 30 jours','Dans les 3 mois'].indexOf(A.delai)>-1)p+=20;
if(/Entre (5|10|15)|Plus de 20/.test(A.budget||''))p+=15;
if(A.decideur==='Oui')p+=10;if(A.conjoint==='Non')p+=5;
if(A.rdv_date)p+=10;
if(A.espace==='Oui'||(A.toit&&A.toit!=='Je ne sais pas'))p+=5;if(['Sud','Sud-est / Sud-ouest'].indexOf(A.expo)>-1)p+=5;
if(A.finance==='Avec mes économies'||A.finance==='Avec un financement bancaire')p+=5;
return p}
function payload(status){var s=score();return Object.assign({statut_lead:status,score:s,niveau:s>=70?'CHAUD':s>=45?'TIÈDE':'FROID',date:new Date().toISOString(),source:document.referrer||location.href},A)}
function send(status){var d=payload(status);var EPS=[].concat(ENDPOINT).filter(Boolean);EPS.forEach(function(u){try{fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d),keepalive:true}).catch(function(){})}catch(e){}});return d}
function start(){app.innerHTML='<div class="card"><h1>Découvrez si votre maison peut bénéficier de solutions énergétiques adaptées à votre logement.</h1><p class="sub">Répondez à quelques questions pour obtenir une première étude personnalisée de votre projet solaire ou de chauffage.</p><button class="btn" style="width:100%" id="go">Commencer (2 min)</button></div>';document.getElementById('go').onclick=function(){i=0;show()}}
function show(){
var L=vis(),q=L[i];
var h='<div class="bar"><i style="width:'+Math.round(i/L.length*100)+'%"></i></div><div class="card"><div class="st">'+STEPS[q.s]+' • '+(i+1)+'/'+L.length+'</div><h2>'+q.t+'</h2>';
if(q.o){q.o.forEach(function(o,k){h+='<button class="o'+(A[q.id]===o?' on':'')+'" data-k="'+k+'">'+o+'</button>'})}
else{q.f.forEach(function(f){h+='<label for="'+f[0]+'">'+f[1]+'</label>'+(f[2]==='sel'?'<select id="'+f[0]+'">'+f[3].split('|').map(function(o){return '<option'+(A[f[0]]===o?' selected':'')+'>'+o+'</option>'}).join('')+'</select>':'<input id="'+f[0]+'" type="'+f[2]+'"'+(f[2]==='date'?' min="'+new Date(Date.now()+864e5).toISOString().slice(0,10)+'"':'')+' value="'+(A[f[0]]||'')+'">')});
if(q.rgpd)h+='<label class="c"><input type="checkbox" id="rg"><span>J’accepte d’être recontacté par ON’NIVA (y compris par téléphone) pour mon étude énergétique. Données traitées uniquement pour répondre à ma demande, conservées 3 ans maximum, droits d’accès et d’effacement sur demande.</span></label>';
h+='<div class="err" id="er"></div>'}
h+='<div class="row">'+(i>0?'<button class="btn g" id="bk">Retour</button>':'')+(q.f?'<button class="btn" id="nx">Continuer</button>':'')+'</div>'+(q.skip?'<div class="row"><button class="btn g" style="flex:1" id="sk">'+q.skip+'</button></div>':'')+'</div>';
app.innerHTML=h;
if(q.o)app.querySelectorAll('.o').forEach(function(b){b.onclick=function(){A[q.id]=q.o[+b.dataset.k];var m=q.end&&q.end(A);if(m){send('NON SÉLECTIONNÉ');return fin(m)}i++;if(i>=vis().length)return done();show()}});
if(i>0)document.getElementById('bk').onclick=function(){i--;show()};
if(q.skip)document.getElementById('sk').onclick=function(){A.rdv_date='';A.rdv_creneau='';i++;show()};
if(q.f)document.getElementById('nx').onclick=function(){
var ok=true;q.f.forEach(function(f){var v=document.getElementById(f[0]).value.trim();A[f[0]]=v;if(!v)ok=false});
if(!ok)return err('Merci de remplir tous les champs.');
if(q.rdv){var dt=new Date(A.rdv_date+'T12:00'),dw=dt.getDay();if(dw===0||dw===6)return err('Merci de choisir un jour du lundi au vendredi.');if(dt<=new Date())return err('Merci de choisir une date à venir.')}
if(q.rgpd){if(!/^\S+@\S+\.\S+$/.test(A.email))return err('E-mail invalide.');if(!/^[0-9 +.]{9,}$/.test(A.tel))return err('Téléphone invalide.');if(!document.getElementById('rg').checked)return err('Merci d’accepter d’être recontacté.');send('PARTIEL (coordonnées)')}
i++;show()}}
function err(m){document.getElementById('er').textContent=m}
function fin(m){app.innerHTML='<div class="card"><h2>Désolé</h2><p class="sub">'+m+'</p></div>'}
function done(){
var d=send('COMPLET'),x='';
if(LEAD_EMAIL){x='<a class="btn" style="display:block;text-align:center;text-decoration:none" href="mailto:'+LEAD_EMAIL+'?subject='+encodeURIComponent('Nouveau lead '+d.niveau+' - '+A.prenom+' '+A.nom)+'&body='+encodeURIComponent(JSON.stringify(d,null,1))+'">Envoyer ma demande par e-mail</a>'}
else if(!ENDPOINT){x='<p class="tag">Mode démo : aucun envoi configuré. Données du lead :</p><pre style="white-space:pre-wrap;font-size:12px;background:#0b1220;padding:12px;border-radius:10px;max-height:220px;overflow:auto">'+JSON.stringify(d,null,1).replace(/</g,'&lt;')+'</pre>'}
app.innerHTML='<div class="card"><div class="st" style="color:var(--ok)">Demande envoyée</div><h2>Merci '+A.prenom+' !</h2><p class="sub">Un conseiller ON’NIVA vous recontacte rapidement pour votre première étude personnalisée, gratuite et sans engagement.</p>'+x+'</div>'}
start();
</script>
</body>
</html>
